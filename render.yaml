# How Skymate is deployed.
#
# Two services from one repository: the API, which holds every key, and the
# board, which is static files and holds none. Both on Render's free tier.
#
# The Node version is not set here. It comes from .nvmrc at the repository
# root, which is also what CI reads, so there is one version to change rather
# than three that can disagree.
services:
  # The API. Everything that needs a key happens here.
  - name: skymate-api
    type: web
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    # Cheap, needs no upstream call, and says which integrations are
    # configured without saying how much allowance is left.
    healthCheckPath: /api/health
    envVars:
      # sync: false means Render asks once and stores it. None of these are
      # in the repository and none of them should ever be.
      - key: RAPIDAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # The board's own URL. Without it the browser refuses every call, since
      # the two halves are on different origins once deployed.
      - key: ALLOWED_ORIGINS
        sync: false

  # The board. Built once, served as files.
  - name: skymate
    type: web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Where the API is. Read at build time, so it belongs here rather than
      # on the service that serves the files.
      - key: VITE_API_URL
        sync: false
    routes:
      # The board is one page with client-side routes. Without this, opening
      # /flight/BA117 directly, or refreshing on it, asks the host for a file
      # that does not exist and gets a 404 instead of the app.
      - type: rewrite
        source: /*
        destination: /index.html
